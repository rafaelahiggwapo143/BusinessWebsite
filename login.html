<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Access | Crisp PanTon Rolls</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] },
                    colors: { neonOrange: '#FF5500', neonYellow: '#FFC700', techDark: '#0B0F17', cardDark: '#161F30', borderDark: '#233047' }
                }
            }
        }
    </script>
</head>
<body class="bg-techDark text-gray-100 font-sans min-h-screen flex flex-col justify-between antialiased">

    <!-- Navbar -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-techDark/90 backdrop-blur-xl border-b border-borderDark/60">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2.5">
                <div class="bg-gradient-to-tr from-neonOrange to-neonYellow text-techDark p-2 rounded-xl font-bold">
                    <i data-lucide="flame" class="w-5 h-5"></i>
                </div>
                <span class="text-xl font-heading font-black text-white">CRISP<span class="text-neonOrange">PANTON</span></span>
            </a>
            <a href="index.html" class="text-xs font-semibold text-gray-300 hover:text-neonOrange transition flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Home
            </a>
        </div>
    </nav>
    

    <!-- Main Auth Container -->
    <main class="pt-28 pb-16 flex-grow flex items-center justify-center px-4">
        <div class="glass-panel border border-neonOrange/30 rounded-3xl p-6 sm:p-10 w-full max-w-md shadow-2xl relative bg-cardDark/80">
            
            <!-- Tab Switcher -->
            <div class="flex border-b border-borderDark mb-6 pb-2">
                <button id="tabLoginBtn" onclick="switchTab('login')" class="flex-1 pb-2 text-center text-sm font-bold text-neonOrange border-b-2 border-neonOrange transition">Login</button>
                <button id="tabRegisterBtn" onclick="switchTab('register')" class="flex-1 pb-2 text-center text-sm font-semibold text-gray-400 hover:text-white transition">Register Account</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <h2 class="text-xl font-heading font-bold text-white mb-2">Welcome Back</h2>
                <p class="text-xs text-gray-400 mb-4">Enter your registered credentials to access your Crisp PanTon account and order rolls.</p>
                
                <div>
                    <label class="block text-xs font-mono uppercase text-gray-300 mb-1">Email or Username</label>
                    <input type="text" id="loginEmail" required class="w-full bg-techDark border border-borderDark rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-neonOrange transition" placeholder="e.g. student@cebu-east.edu.ph">
                </div>

                <div>
                    <label class="block text-xs font-mono uppercase text-gray-300 mb-1">Password</label>
                    <input type="password" id="loginPass" required class="w-full bg-techDark border border-borderDark rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-neonOrange transition" placeholder="••••••••">
                </div>

                <div id="loginError" class="text-xs text-red-400 hidden font-mono"></div>

                <button type="submit" class="w-full py-3.5 bg-neonOrange hover:bg-orange-600 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-neonOrange/20 transition">
                    Sign In to Portal
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <h2 class="text-xl font-heading font-bold text-white mb-2">Create New Account</h2>
                <p class="text-xs text-gray-400 mb-4">Register your credentials to start ordering Crispy Pancit Canton Rolls.</p>

                <div>
                    <label class="block text-xs font-mono uppercase text-gray-300 mb-1">Full Name</label>
                    <input type="text" id="regName" required class="w-full bg-techDark border border-borderDark rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-neonOrange transition" placeholder="Rafael Ahig">
                </div>
                
                <div>
                    <label class="block text-xs font-mono uppercase text-gray-300 mb-1">Email Address</label>
                    <input type="email" id="regEmail" required class="w-full bg-techDark border border-borderDark rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-neonOrange transition" placeholder="rafael@example.com">
                </div>

                <div>
                    <label class="block text-xs font-mono uppercase text-gray-300 mb-1">Password</label>
                    <input type="password" id="regPass" required class="w-full bg-techDark border border-borderDark rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-neonOrange transition" placeholder="At least 6 characters">
                </div>

                <div id="regError" class="text-xs text-red-400 hidden font-mono"></div>

                <button type="submit" class="w-full py-3.5 bg-neonOrange hover:bg-orange-600 text-white font-bold text-xs uppercase tracking-wider rounded-xl shadow-lg shadow-neonOrange/20 transition">
                    Register Credentials
                </button>
            </form>

        </div>
    </main>

    <footer class="bg-cardDark/80 border-t border-borderDark/60 py-6 text-center text-xs text-gray-400">
        <p>© 2026 Crisp PanTon Rolls | Secure Authentication Portal</p>
    </footer>

    <script>
        lucide.createIcons();

        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginBtn = document.getElementById('tabLoginBtn');
            const registerBtn = document.getElementById('tabRegisterBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginBtn.className = "flex-1 pb-2 text-center text-sm font-bold text-neonOrange border-b-2 border-neonOrange transition";
                registerBtn.className = "flex-1 pb-2 text-center text-sm font-semibold text-gray-400 hover:text-white transition";
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerBtn.className = "flex-1 pb-2 text-center text-sm font-bold text-neonOrange border-b-2 border-neonOrange transition";
                loginBtn.className = "flex-1 pb-2 text-center text-sm font-semibold text-gray-400 hover:text-white transition";
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value;

            let users = JSON.parse(localStorage.getItem('crisp_registered_users') || '[]');
            if (users.find(u => u.email === email)) {
                const err = document.getElementById('regError');
                err.innerText = "Email already registered! Please login.";
                err.classList.remove('hidden');
                return;
            }

            users.push({ name, email, pass });
            localStorage.setItem('crisp_registered_users', JSON.stringify(users));
            localStorage.setItem('crisp_current_user', name);
            alert("Registration successful! Welcome, " + name);
            window.location.href = "order.html";
        }

        function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;

            let users = JSON.parse(localStorage.getItem('crisp_registered_users') || '[]');
            
            // Allow default test account or registered accounts
            let validUser = users.find(u => (u.email === identifier || u.name === identifier) && u.pass === pass);
            
            if (validUser || (identifier === "student@cebu.edu.ph" && pass === "password")) {
                localStorage.setItem('crisp_current_user', validUser ? validUser.name : "Student CEC");
                window.location.href = "order.html";
            } else {
                const err = document.getElementById('loginError');
                err.innerText = "Invalid credentials. Please register or check your login details.";
                err.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
